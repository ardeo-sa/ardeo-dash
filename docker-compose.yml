services:
  web:
    build: .
    container_name: ardeo_dash_app
    env_file: .env
    environment:
      - LOG_FILE=${LOG_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./app.log:/app/app.log
    labels:
      - "logging=promtail"

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A app.celery_app.celery worker --loglevel=info
    env_file: .env
    environment:
      - LOG_FILE=${CELERY_WORKER_LOG_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - web
      - redis
    volumes:
      - ./celery_worker.log:/app/celery_worker.log
    labels:
      - "logging=promtail"

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - LOG_FILE=${CELERY_BEAT_LOG_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - redis
      - web
    volumes:
      - ./celery_beat.log:/app/celery_beat.log
    labels:
      - "logging=promtail"

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${METRICS_DB_USER}
      POSTGRES_PASSWORD: ${METRICS_DB_PASSWORD}
      POSTGRES_DB: ${METRICS_DB_NAME}
    ports:
      - "55432:5432"

  redis:
    image: redis:7
    container_name: redis_broker
    ports:
      - "6379:6379"
