name: cla-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const user = pr.user.login;
            const prNumber = pr.number;

            // Block PRs from forks (shouldn't happen if forking is disabled, but just in case)
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed(`PRs from forks are not allowed in this repository.`);
              return;
            }

            // Allow trusted bots
            const allowedBots = new Set(['dependabot[bot]']);
            if (allowedBots.has(user)) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: 'cla-required'
                });
              } catch (e) {}
              return;
            }

            // Search for a closed issue with label 'cla-signed' authored by this user
            const q = `repo:${owner}/${repo} is:issue is:closed label:"cla-signed" author:${user} in:title "CLA Signature"`;
            const res = await github.rest.search.issuesAndPullRequests({ q });
            const signed = (res.data.total_count || 0) > 0;

            // Ensure the 'cla-required' label exists
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            await ensureLabel('cla-required', 'd93f0b', 'CLA signature required before merge');

            if (!signed) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: ['cla-required']
              });
              core.setFailed(`@${user} must sign the CLA: open the "CLA Signature" issue form → https://github.com/${owner}/${repo}/issues/new?template=cla.yml`);
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: 'cla-required'
                });
              } catch (e) {}
            }
