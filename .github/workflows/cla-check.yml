name: cla-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Debug PR info
        run: |
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR number: ${{ github.event.pull_request.number }}"

      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const user = pr.user.login;
            const prNumber = pr.number;

            console.log(`Processing PR #${prNumber} from ${user}`);

            // Allow trusted bots
            const allowedBots = new Set(['dependabot[bot]']);
            if (allowedBots.has(user)) {
              console.log(`Skipping CLA for bot: ${user}`);
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: 'cla-required'
                });
              } catch (e) {}
              return;
            }

            // Check CLA
            async function hasSignedCla(owner, repo, user) {
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: "closed",
                  labels: "cla-signed",
                  per_page: 100
                }
              );

              return issues.some(issue =>
                issue.user?.login === user &&
                issue.title.includes("CLA Signature")
              );
            }

            const signed = await hasSignedCla(owner, repo, user);
            console.log(`CLA signed: ${signed}`);

            // Ensure 'cla-required' label exists
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                console.log(`Creating label: ${name}`);
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (createErr) {
                  console.log(`Could not create label (likely from forked PR): ${createErr.message}`);
                }
              }
            }
            await ensureLabel('cla-required', 'd93f0b', 'CLA signature required before merge');

            if (!signed) {
              console.log(`Adding cla-required label to PR #${prNumber}`);
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: ['cla-required']
              });
              core.setFailed(`@${user} must sign the CLA: open the "CLA Signature" issue form → https://github.com/${owner}/${repo}/issues/new?template=cla.yml`);
            } else {
              console.log(`Removing cla-required label from PR #${prNumber} if present`);
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: 'cla-required'
                });
              } catch (e) {
                console.log('Label not present; nothing to remove.');
              }
            }
