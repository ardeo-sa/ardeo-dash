name: cla-issue-auto

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const issue = context.payload.issue;
            if (!issue) return;

            // Only process our CLA Signature issues
            if (!/^CLA Signature/i.test(issue.title || "")) return;

            // Check the required checkbox
            const ok = /\[x\]\s*I have read and agree to the Ardeo Limited Contributor Licence Agreement\./i.test(issue.body || "");

            // Ensure cla-signed label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'cla-signed' });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: 'cla-signed',
                color: '0e8a16',
                description: 'Contributor has signed the CLA'
              });
            }

            if (ok) {
              // Mark as signed and close
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['cla-signed']
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: "Thanks! Your CLA acknowledgement has been recorded. You can now submit pull requests."
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            } else {
              // Checkbox not ticked -> nudge
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: "Please tick the confirmation checkbox to sign the CLA. Edit this issue and resubmit."
              });
            }
