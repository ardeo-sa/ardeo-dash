name: cla-issue-auto
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            if (!issue) { return; }
            const titleOk = /^CLA Signature/i.test(issue.title || "");
            if (!titleOk) { return; }
            const body = issue.body || "";
            const ok = /\[x\]\s*I have read and agree to the Ardeo Contributor Licence Agreement\./i.test(body);
            async function ensureLabel(name, color, description) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { await github.rest.issues.createLabel({ owner, repo, name, color, description }); }
            }
            await ensureLabel('cla-signed', '0e8a16', 'Contributor has signed the CLA');
            if (ok) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['cla-signed'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "Thanks! Your CLA acknowledgement has been recorded. You can now submit pull requests." });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "Please tick the confirmation checkbox to sign the CLA. Edit this issue and resubmit." });
            }
// (Optional) Echo the chosen CLA type if present in the form body
const m = body.match(/Which CLA are you signing\\?\\s*\\n\\s*\\*\\*(.+?)\\*\\*/i);
if (m && m[1]) {
  await github.rest.issues.createComment({
    owner, repo, issue_number: issue.number,
    body: `Recorded CLA type: **${m[1].trim()}**`
  });
}

